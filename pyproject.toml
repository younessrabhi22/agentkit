[project]
name = "agentkit"
version = "0.1.0"
description = "Modular starter for LLM apps: Gemma via the Gemini API or Ollama, agent, tools, RAG, Gradio and CLI UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "gradio>=5,<6",
    "numpy",
    "ollama",
    "python-dotenv",
    "rich",
]

[project.scripts]
agentkit = "agentkit.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]
